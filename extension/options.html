<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>NanyNany settings</title></head><body class="options"><main><div class="mark">N</div><h1>NanyNany</h1><p class="lead">Connect this browser, then forget about organizing tabs.</p><div id="authForm"><label>Server address<input id="apiBase" type="url" placeholder="https://your-nanynany-worker.workers.dev"></label><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><div class="actions"><button id="login" class="primary">Sign in</button><button id="register" class="secondary">Create account</button></div><p id="authStatus" class="status" aria-live="polite"></p></div><div id="connectedBox" hidden><p class="lead">Connected as <strong id="connectedEmail"></strong></p><button id="logout" class="secondary">Sign out</button></div><hr><h2>Don't capture these sites</h2><p class="hint">One domain per line. Titles and URLs from these sites never leave your browser.</p><textarea id="excluded" rows="12"></textarea><button id="save" class="secondary">Save exclusions</button><p id="saveStatus" class="status" aria-live="polite"></p></main><script src="options.js"></script></body></html>
