name: taskee
description: "Resource Memory — save useful coding resources and resurface them when they matter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  go_router: ^17.2.3
  get_it: ^9.2.1
  google_fonts: ^8.1.0
  flutter_card_swiper: ^7.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  http: ^1.5.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  receive_sharing_intent: ^1.9.0
  desktop_drop: ^0.7.1
  super_clipboard: ^0.9.1
  record: ^6.2.1
  file_picker: ^11.0.3
  cross_file: ^0.3.5+1

dev_dependencies:
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
