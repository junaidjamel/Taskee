name: Mobile Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/mobile-builds.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/mobile-builds.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable Android APK
        run: >-
          flutter build apk --release
          --dart-define=RESOURCE_API_URL=${{ secrets.RESOURCE_API_URL }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: resource-memory-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-nosign:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Install iOS pods
        working-directory: ios
        run: pod install

      - name: Generate Flutter iOS and SPM configuration
        run: >-
          flutter build ios --config-only --release --no-codesign
          --dart-define=RESOURCE_API_URL=${{ secrets.RESOURCE_API_URL }}

      - name: Configure native Share Extension target and SPM dependency
        working-directory: ios
        run: ruby scripts/configure_share_extension.rb

      - name: Verify Share Extension target exists
        working-directory: ios
        run: xcodebuild -project Runner.xcodeproj -list | grep -q ShareExtension

      - name: Verify Share Extension links Flutter plugin package
        working-directory: ios
        run: grep -q FlutterGeneratedPluginSwiftPackage Runner.xcodeproj/project.pbxproj

      - name: Build iOS without signing
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=RESOURCE_API_URL=${{ secrets.RESOURCE_API_URL }}

      - name: Verify Share Extension is embedded
        run: test -d build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex

      - name: Package unsigned iOS app
        run: |
          mkdir -p build/ios-artifact
          cp -R build/ios/iphoneos/Runner.app build/ios-artifact/NanyNany.app
          ditto -c -k --sequesterRsrc --keepParent build/ios-artifact/NanyNany.app build/NanyNany-ios-nosign.zip

      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: nanynany-ios-nosign
          path: build/NanyNany-ios-nosign.zip
          if-no-files-found: error
